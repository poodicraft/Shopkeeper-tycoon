apply plugin: 'com.android.application'

android {
    compileSdkVersion 34

    defaultConfig {
        applicationId "com.poodicraft.shopkeeper"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main {
            manifest.srcFile 'src/main/AndroidManifest.xml'
            java.srcDirs = ['src/main/java']
            res.srcDirs = ['src/main/res']
        }
    }

    buildTypes {
        release {
            // The game has no reflection and no external dependencies, so shrinking
            // is safe; it is left off by default to keep stack traces readable.
            minifyEnabled false
        }
    }

    lintOptions {
        abortOnError false
    }
}

// Deliberately no dependencies: the game uses only the Android framework.
dependencies {
}
